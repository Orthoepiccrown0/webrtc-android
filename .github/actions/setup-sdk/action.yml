name: Set up SDK build
description: Pinned JDK, Android SDK/NDK and Gradle wrapper setup.
inputs:
  cache-disabled:
    description: Disable Gradle caches for signing jobs.
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: "25"
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: "platform-tools platforms;android-37 build-tools;37.0.0 ndk;29.0.14033849"
        log-accepted-android-sdk-licenses: "false"
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: basic
        cache-disabled: ${{ inputs.cache-disabled }}
        cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
